{% extends "sensors/layout/master.html" %}
{% load static %}

{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="container mt-5 text-center">
    <div class="card shadow-sm col-md-6 offset-md-3">
        <div class="card-body">
            <h3 class="text-success"><i class="fas fa-check-circle"></i> Password Changed!</h3>
            <p>Your password has been set. You may go ahead and log in now.</p>
            <a href="{% url 'sensors:login' %}" class="btn btn-primary">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
