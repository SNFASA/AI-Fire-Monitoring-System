<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | BOMBA Smart Alert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0;
        }
        .error-card { 
            border-radius: 1.5rem; 
            border: none; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06); 
            max-width: 400px; 
            width: 100%; 
            padding: 3rem 2rem; 
            text-align: center; 
            background: white; 
        }
        .error-icon { 
            font-size: 4.5rem; 
            color: #df2020; 
            margin-bottom: 1.5rem; 
        }
        .btn-home { 
            background-color: #df2020; 
            color: white; 
            border-radius: 50rem; 
            font-weight: 700; 
            padding: 0.85rem 1.5rem; 
            margin-top: 1.5rem; 
            width: 100%; 
            border: none;
            box-shadow: 0 4px 10px rgba(223, 32, 32, 0.3);
        }
        .btn-home:hover, .btn-home:active { 
            background-color: #b91a1a; 
            color: white; 
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container px-4">
        <div class="mx-auto error-card">
            <i class="fa-solid fa-triangle-exclamation error-icon"></i>
            <h4 class="fw-bolder mb-2 text-dark">Something went wrong</h4>
            <p class="text-muted small mb-4">{{ message|default:"We encountered an unexpected error. Please try again or return to the main dashboard." }}</p>
            <a href="/" class="btn btn-home text-decoration-none d-block">
                <i class="fa-solid fa-house me-2"></i> Return to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
