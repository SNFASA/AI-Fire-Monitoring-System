[pytest]
# 1. Point to your Django settings
DJANGO_SETTINGS_MODULE = core.settings 

# 2. Look for these file patterns
python_files = tests.py test_*.py *_tests.py

# 3. Enable async mode automatically for all async tests
# This saves you from adding @pytest.mark.asyncio to every test
asyncio_mode = auto

# 4. CI/CD Speed Optimizations
addopts = 
    --strict-markers
    --no-migrations
    --reuse-db
    -n auto