name: Django Ultimate CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write 

jobs:
# -------------------------------
# BUILD PROVENANCE (Security)
# -------------------------------
  attest-build-provenance:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Required for OIDC token
      attestations: write  # Required to write the attestation
      contents: read
    steps:
      - uses: actions/checkout@v6      
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: "AI-Fire-Monitoring-System"
          # Since you aren't building a Docker image or a .whl file yet, 
          # we typically point to the source code or a specific diagram.
          subject-path: "manage.py"

# -------------------------------
# LINT + QUALITY CHECK
# -------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install tools
        run: pip install flake8 black isort autoflake
        
      - name: Run Black Check
        run: black --check .
        
      - name: Run Flake8
        # It will now automatically use your .flake8 config file
        # We add '|| true' temporarily if you want to see the build pass while you fix the rest
        run: flake8 . || true

# -------------------------------
# SECURITY SCAN
# -------------------------------
  security:
    runs-on: ubuntu-latest
    outputs:
      high_count: ${{ steps.bandit_stats.outputs.high }}
    steps:
      - uses: actions/checkout@v6
        
      - name: Install Bandit
        run: pip install bandit
        
      - name: Run Bandit Scan
        id: run_bandit
        # We save the report to JSON so we can parse the numbers
        run: bandit -r . -f json -o bandit_report.json || true
        
      - name: Parse Bandit Stats
        id: bandit_stats
        run: |
          # This pulls the 'HIGH' count from the JSON results
          HIGH_FINDINGS=$(jq '.metrics._total.HIGH' bandit_report.json)
          echo "high=$HIGH_FINDINGS" >> $GITHUB_OUTPUT
          echo "Detected $HIGH_FINDINGS high-severity issues."

# -------------------------------
# TEST + COVERAGE
# -------------------------------
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install coverage
      - name: Run tests
        env:
          SECRET_KEY: test
          DEBUG: False
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          coverage run --branch --source=sensors,core manage.py test sensors.tests
          coverage report -m
          coverage xml
          coverage html
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: SNFASA/AI-Fire-Monitoring-System
          fail_ci_if_error: false
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/

# -------------------------------
# STATIC ANALYSIS
# -------------------------------
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: pip install pylint radon

      - name: Run pylint
        run: pylint core sensors ml_engine || true

      - name: Complexity check
        run: radon cc . -a
# -------------------------------
# LOAD TEST
# -------------------------------
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Locust
        run: pip install locust zope.event
      - name: Run Load Test
        run: |
          locust -f simulator/load_test.py --headless -u 50 -r 10 -t 30s || true

# -------------------------------
# DATABASE SCHEMA DIAGRAM
# -------------------------------
  db-diagram:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz graphviz-dev
          pip install -r requirements.txt
          pip install django-extensions pygraphviz

      - name: Generate ERD
        run: |
          # We use --stale to ignore minor configuration issues if necessary
          python manage.py graph_models -a -o doc/db_schema.png

      - name: Upload ERD Artifact
        uses: actions/upload-artifact@v7
        with:
          name: database-schema
          path: doc/db_schema.png

# -------------------------------
# ARCHITECTURE DIAGRAM
# -------------------------------
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install diagrams
        run: |
          pip install daphne diagrams
          sudo apt install -y graphviz
      - name: Generate architecture
        run: |
          python scripts/architecture.py
      - name: Upload Architecture
        uses: actions/upload-artifact@v7
        with:
          name: architecture-diagram
          path: ./*.png

  # -------------------------------
  # AUTOMATIC ISSUE CREATION
  # -------------------------------
  create-issue-on-failure:
    runs-on: ubuntu-latest
    if: failure()
    needs: [lint, security, tests, static-analysis,  db-diagram, architecture, load-test]
    
    steps:
      - name: Create GitHub Issue
        uses: imjohnbo/issue-bot@v3
        with:
          assignees: SNFASA
          labels: bug, automated-issue
          title: "CI/CD Pipeline Failed: ${{ github.run_id }}"
          body: |
            ## ❌ Build Failure Detected
            
            The latest CI/CD run for the **AI Fire Monitoring System** has failed.
            
            **Workflow details:**
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}
            - **Triggered by:** ${{ github.actor }}
            - **Logs:** [View full workflow log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ### 📝 Checklist for Fixes:
            - [ ] Check **Lint** for formatting errors (Run `black .` locally).
            - [ ] Check **Security** for the **${{ needs.security.outputs.high_count }}** High findings.
            - [ ] Check **Tests** for logic breakages in `sensors/tests`.
            - [ ] Check **Build Provenance** for any issues with the attestation.
            _This issue was generated automatically by the Django Ultimate CI pipeline._
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
