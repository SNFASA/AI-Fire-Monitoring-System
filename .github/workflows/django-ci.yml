name: Django Ultimate CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  security-events: write
  actions: read
  issues: write 

jobs:
# -------------------------------
# LINT + QUALITY CHECK
# -------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install flake8 black isort autoflake
      
      - name: Run Black Check
        # Exclude migrations because they are auto-generated
        run: black --check . --exclude migrations || true
        
      - name: Run Flake8
        run: flake8 . || true

# -------------------------------
# SECURITY SCAN
# -------------------------------
  security:
    runs-on: ubuntu-latest
    outputs:
      high_count: ${{ steps.bandit_stats.outputs.high }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit Scan
        id: run_bandit
        run: |
          bandit -r . -f json -o bandit_report.json --exclude ./venv,./.venv,./sensors/tests || true
      - name: Parse Bandit Stats
        id: bandit_stats
        run: |
          HIGH_FINDINGS=$(jq '.metrics._total.HIGH' bandit_report.json)
          echo "high=$HIGH_FINDINGS" >> $GITHUB_OUTPUT

# -------------------------------
# TEST + COVERAGE
# -------------------------------
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install coverage
      - name: Run tests
        env:
          SECRET_KEY: test
          DEBUG: True
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          coverage run manage.py test sensors.tests
          coverage report -m
          coverage html
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: SNFASA/AI-Fire-Monitoring-System
          fail_ci_if_error: false
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

# -------------------------------
# ARCHITECTURE DIAGRAM
# -------------------------------
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      - name: Install python tools
        run: pip install daphne diagrams
      - name: Generate architecture
        run: python scripts/architecture.py
      - name: Upload Architecture
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagram
          path: ./*.png

# -------------------------------
# AUTOMATIC ISSUE CREATION
# -------------------------------
  create-issue-on-failure:
    runs-on: ubuntu-latest
    if: failure()
    needs: [lint, security, tests, architecture]
    permissions:
      issues: write
    steps:
      - name: Create GitHub Issue
        uses: imjohnbo/issue-bot@v3
        with:
          assignees: SNFASA
          labels: bug, automated-issue
          title: "CI/CD Pipeline Failed: ${{ github.run_id }}"
          body: |
            ## ❌ Build Failure Detected
            
            **Current High-Severity Findings:** ${{ needs.security.outputs.high_count || 'Unknown' }}
            
            **Workflow details:**
            - **Commit:** ${{ github.sha }}
            - **Logs:** [View full workflow log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ### 📝 Fix Checklist:
            - [ ] Run `black .` to fix formatting.
            - [ ] Review the **Security Scan** job for the ${{ needs.security.outputs.high_count }} vulnerabilities.
            - [ ] Check **architecture** job if `graphviz` crashed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}