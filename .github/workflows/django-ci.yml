name: Django Ultimate CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

jobs:
  # =========================================================
  # LINT + FORMAT CHECK
  # =========================================================
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort autoflake

      - name: Run Black (No failure on diff)
        run: black . || true

      - name: Run Isort (No failure on diff)
        run: isort . || true

      - name: Run Flake8 (Warning only)
        run: flake8 . --exit-zero

  # =========================================================
  # SECURITY SCAN
  # =========================================================
  security:
    runs-on: ubuntu-latest
    outputs:
      high_count: ${{ steps.bandit_stats.outputs.high }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r . -f json -o bandit_report.json || true

      - name: Parse Bandit Results
        id: bandit_stats
        run: |
          HIGH=$(jq '.metrics._totals.SEVERITY.HIGH // 0' bandit_report.json)
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "High Severity Findings: $HIGH"

  # =========================================================
  # TESTS + COVERAGE (with GeoDjango Spatial Support)
  # =========================================================
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Spatial GIS OS Dependencies (Fixes libgdal crash)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev gdal-data libgeos-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage psycopg2-binary

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run Migrations
        run: python manage.py migrate

      - name: Run Tests
        run: |
          coverage run --branch manage.py test
          coverage report -m
          coverage xml
          coverage html

      - name: Upload Coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

      - name: Upload Coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # =========================================================
  # STATIC ANALYSIS
  # =========================================================
  static-analysis:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: core.settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django radon

      - name: Run Pylint
        run: |
          pylint \
          --load-plugins pylint_django \
          --django-settings-module=core.settings \
          core sensors ml_engine || true

      - name: Complexity Analysis
        run: |
          radon cc . -a
          radon mi . -s

  # =========================================================
  # LOAD TEST (Locust & gevent dependency fix applied)
  # =========================================================
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Add this missing step!
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify locust file exists
        run: |
          if [ ! -f simulator/load_test.py ]; then
            echo "Missing simulator/load_test.py"
            exit 1
          fi

      - name: Install Locust & Core Prerequisites
        run: |
          python -m pip install --upgrade pip
          pip install zope.event locust
          pip install -r requirements.txt

      - name: Run Headless Load Test
        run: |
          locust \
          -f simulator/load_test.py \
          --headless \
          -u 50 \
          -r 10 \
          -t 30s

  # =========================================================
  # DATABASE ERD (GeoDjango Spatial Support added)
  # =========================================================
  db-diagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Spatial GIS OS Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev gdal-data libgeos-dev graphviz graphviz-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install django-extensions pygraphviz

      - name: Generate ERD
        run: |
          mkdir -p docs
          python manage.py graph_models -a -o docs/db_schema.png

      - name: Upload ERD
        uses: actions/upload-artifact@v4
        with:
          name: database-schema
          path: docs/db_schema.png

  # =========================================================
  # ARCHITECTURE DIAGRAM
  # =========================================================
  architecture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install diagram dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          python -m pip install --upgrade pip
          pip install diagrams daphne

      - name: Generate Architecture Diagram
        run: |
          python scripts/architecture.py

      - name: Upload Architecture
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagram
          path: "*.png"

  # =========================================================
  # TRIVY SECURITY SCAN
  # =========================================================
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

  # =========================================================
  # AUTO ISSUE CREATION
  # =========================================================
  create-issue-on-failure:
    runs-on: ubuntu-latest
    if: failure()
    needs:
      - lint
      - security
      - tests
      - static-analysis
      - load-test
      - db-diagram
      - architecture
      - trivy

    steps:
      - name: Create GitHub Issue
        uses: imjohnbo/issue-bot@v3
        with:
          assignees: SNFASA
          labels: bug, automated-issue
          title: "CI/CD Pipeline Failed - Run #${{ github.run_number }}"
          body: |
            ## CI/CD Pipeline Failure

            A workflow job failed in the AI Fire Monitoring System.

            ### Details
            - **Workflow:** ${{ github.workflow }}
            - **Run Number:** #Ref ${{ github.run_number }}
            - **Commit:** SHA ${{ github.sha }}
            - **Branch Target:** ${{ github.ref_name }}
            - **Triggered By:** @${{ github.actor }}

            ### Security Findings
            - **Bandit High Severity Counter:** ${{ needs.security.outputs.high_count || 0 }}

            ### Action Logs Links
            👉 Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            *Auto-generated report by system actions pipeline dispatcher engine.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}