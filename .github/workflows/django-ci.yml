
name: Django Ultimate CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write 

jobs:
# -------------------------------
# BUILD PROVENANCE (Security)
# -------------------------------
#  attest-build-provenance:
#    runs-on: ubuntu-latest
