name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # ------------------------------------------------------------------
    # 1. THE DATABASE SERVICE (The "Lock")
    # We create the user 'postgres' with the password 'postgres' here.
    # ------------------------------------------------------------------
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres      # <--- MUST MATCH the Test Step below
          POSTGRES_PASSWORD: postgres  # <--- MUST MATCH the Test Step below
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    # (Optional) Install GDAL if your geospatial tests fail later
    # - name: Install GDAL
    #   run: |
    #     sudo apt-get update
    #     sudo apt-get install -y libgdal-dev gdal-bin libproj-dev

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ------------------------------------------------------------------
    # 2. RUN TESTS (The "Key")
    # We tell Django to use the user 'postgres' and password 'postgres'.
    # ------------------------------------------------------------------
    - name: Run Tests
      env:
        SECRET_KEY: 'django-insecure-test-key-for-ci'
        DEBUG: 'True'
        DB_ENGINE: 'django.db.backends.postgresql'
        DB_NAME: 'test_db'
        DB_USER: 'postgres'      # <--- Matches Service above
        DB_PASSWORD: 'postgres'  # <--- Matches Service above
        DB_HOST: 'localhost'
        DB_PORT: '5432'
      run: |
        python manage.py test sensors.tests
    # ------------------------------------------------------------------
    # 3. AUTO-CREATE ISSUE ON FAILURE
    # ------------------------------------------------------------------
    - name: Create GitHub Issue on Failure
      if: failure()  # <--- This ensures the step ONLY runs if the tests crash/fail
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue create \
          --title "🚨 CI Build Failed: ${{ github.workflow }} on branch ${{ github.ref_name }}" \
          --body "The Django CI workflow failed. 
          
          **Branch:** \`${{ github.ref_name }}\`
          **Commit:** \`${{ github.sha }}\`
          
          Please check the action logs here: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --label "bug" \
          --assignee "${{ github.actor }}"