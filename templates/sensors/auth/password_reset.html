{% extends "sensors/layout/master.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container mt-5 mb-5 pb-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card app-card bg-white p-4 p-md-5 text-center">
                <div class="mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle" style="width: 80px; height: 80px;">
                        <i class="fa-solid fa-envelope-open-text fa-2x"></i>
                    </div>
                </div>

                <h4 class="fw-bolder mb-2">Reset Password</h4>
                <p class="text-muted small mb-4">Enter your email address below, and we'll send you a link to reset your password.</p>
                
                <form method="POST" class="django-auth-form">
                    {% csrf_token %}
                    <div class="text-start">
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 fw-bold shadow-sm mt-3">
                        Send Reset Link
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
