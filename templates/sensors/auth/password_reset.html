{% extends "sensors/layout/master.html" %}
{% load static %}

{% block title %}Create New Password{% endblock %}

{% block content %}
<div class="container mt-5 mb-5 pb-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card app-card bg-white p-4 p-md-5 text-center">
                
                <div class="mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle" style="width: 80px; height: 80px;">
                        <i class="fa-solid fa-shield-halved fa-2x"></i>
                    </div>
                </div>

                <h4 class="fw-bolder mb-2">Create New Password</h4>
                <p class="text-muted small mb-4">Please enter your new password twice so we can verify you typed it correctly.</p>
                
                <form method="POST" class="django-auth-form">
                    {% csrf_token %}
                    
                    <div class="text-start">
                        {{ form.as_p }}
                    </div>
                    
                    <button type="submit" class="btn btn-danger btn-lg rounded-pill w-100 fw-bold shadow-sm mt-3">
                        <i class="fa-solid fa-check me-2"></i> Update Password
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
