<script>
    // --- 1. CONFIGURATION & HELPERS ---
    const STYLES = { 
        'streets': 'https://tiles.openfreemap.org/styles/liberty', 
        'dark': 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json', 
        'satellite': 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}' 
    };

    // Helper to get CSRF Token for Django POST requests

    const rawLat = "{{ station_lat|default:'' }}";
    const rawLng = "{{ station_lng|default:'' }}";
    const INITIAL_VIEW = [103.0848, 1.8548]; 
    const centerCoords = (rawLat && rawLng) ? [parseFloat(rawLng), parseFloat(rawLat)] : INITIAL_VIEW;

    // --- 2. MAP INITIALIZATION ---
    const map = new maplibregl.Map({ 
        container: 'map', 
        style: STYLES.streets, 
        center: centerCoords, 
        zoom: (rawLat && rawLng) ? 14 : 12, 
        pitch: 60, 
        antialias: true 
    });

    map.addControl(new maplibregl.FullscreenControl(), 'top-right');
    map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

    // --- 3. MODAL & POLLING LOGIC ---
    function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = String(str);
        return div.innerHTML;
    }

    function safePercent(val) {
        const n = parseFloat(val);
        return (isFinite(n) ? Math.min(100, Math.max(0, n)) : 0);
    }

    function safeSrc(url) {
        try {
            const parsed = new URL(url, window.location.origin);
            return (parsed.protocol === 'https:' || parsed.protocol === 'http:') ? parsed.href : '';
        } catch (_) {
            return '';
        }
    }

    let modalRefreshInterval = null;
    let lastActiveTabId = null;

    window.openLayoutModal = function(userId) {
        const modal = new bootstrap.Modal(document.getElementById('layoutModal'));
        modal.show();
        
        // Initial fetch
        fetchModalData(userId);
        
        // Start polling while modal is open (Requirement 5)
        if (modalRefreshInterval) clearInterval(modalRefreshInterval);
        modalRefreshInterval = setInterval(() => fetchModalData(userId), 2000);
    };

    function fetchModalData(userId) {
        fetch(`/api/get-victim-layout/${userId}/`)
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                const tabsContainer = document.getElementById('victimLayoutTabs');
                const contentContainer = document.getElementById('victimLayoutContent');
                
                // Save which tab was open to prevent UI jump during refresh
                const currentActive = tabsContainer.querySelector('.nav-link.active');
                if (currentActive) lastActiveTabId = currentActive.id;

                tabsContainer.innerHTML = '';
                contentContainer.innerHTML = '';

                if (data.layouts.length === 0) {
                    contentContainer.innerHTML = '<div class=" p-5 text-center">No layouts found for this user.</div>';
                    return;
                }

                data.layouts.forEach((layout, index) => {
                    const safeLayoutId = escapeHTML(layout.layout_id);
                    const tabId = `tab-${safeLayoutId}`;
                    let isActive = (lastActiveTabId === tabId || (!lastActiveTabId && index === 0)) ? 'active' : '';
                    let isShow = (lastActiveTabId === tabId || (!lastActiveTabId && index === 0)) ? 'show active' : '';

                    const li = document.createElement('li');
                    li.className = 'nav-item';
                    const btn = document.createElement('button');
                    btn.className = `nav-link ${isActive} fw-bold`;
                    btn.id = tabId;
                    btn.setAttribute('data-bs-toggle', 'tab');
                    btn.setAttribute('data-bs-target', `#content-${safeLayoutId}`);
                    btn.type = 'button';
                    btn.setAttribute('role', 'tab');
                    btn.textContent = layout.layout_name;
                    li.appendChild(btn);
                    tabsContainer.appendChild(li);

                    const tabPane = document.createElement('div');
                    tabPane.className = `tab-pane fade ${isShow}`;
                    tabPane.id = `content-${safeLayoutId}`;
                    tabPane.setAttribute('role', 'tabpanel');
                    tabPane.style.cssText = 'height:100%; width:100%;';

                    const blueprintWrapper = document.createElement('div');
                    blueprintWrapper.className = 'blueprint-wrapper';
                    blueprintWrapper.style.cssText = 'height:100%; width:100%; position: relative; overflow: hidden;';

                    const img = document.createElement('img');
                    img.src = safeSrc(layout.image_url);
                    img.className = 'blueprint-image';
                    img.style.cssText = 'width:100%; height:100%; object-fit:fill; filter: invert(1); opacity:0.8;';
                    blueprintWrapper.appendChild(img);

                    layout.sensors.forEach((s, i) => {
                        const cssClass = (s.status || "").toLowerCase() === 'fire' ? 'bg-fire' :
                                         ((s.status || "").toLowerCase() === 'warning' ? 'bg-warn' : 'bg-safe');
                        const sensorNode = document.createElement('div');
                        sensorNode.className = `sensor-node ${cssClass}`;
                        sensorNode.style.cssText = `left:${safePercent(s.x)}%; top:${safePercent(s.y)}%; position:absolute;`;
                        sensorNode.textContent = String(i + 1);
                        const label = document.createElement('div');
                        label.className = 'sensor-label';
                        label.textContent = s.name;
                        sensorNode.appendChild(label);
                        blueprintWrapper.appendChild(sensorNode);
                    });

                    tabPane.appendChild(blueprintWrapper);
                    contentContainer.appendChild(tabPane);
                });
            }
        });
    }

    // Stop polling when modal closes
    document.getElementById('layoutModal').addEventListener('hidden.bs.modal', () => {
        if (modalRefreshInterval) {
            clearInterval(modalRefreshInterval);
            modalRefreshInterval = null;
        }
    });

    // --- 4. MAP DATA POLLING ---
    const markers = {};
    function fetchMapData() {
        if (window.isSetupMode) return;
        fetch("{% url 'sensors:map_data' %}")
        .then(res => res.json())
        .then(data => {
            if(data.houses) { 
                let fireCount = 0; 
                let warnCount = 0;
                data.houses.forEach(house => {
                    if (house.lat === null || house.lng === null) return;

                    // Normalize status to lowercase for comparison
                    let st = (house.status || "").toLowerCase();
                    
                    // Logic for counts: Check for both 'warning' AND 'gas leak'
                    if (st === 'fire') {
                        fireCount++;
                    } else if (st === 'warning' || st === 'gas leak') {
                        warnCount++;
                    }

                    // Logic for marker appearance
                    let cls = st === 'fire' ? 'marker-fire' : 
                              (st === 'warning' || st === 'gas leak' ? 'marker-warning' : 'marker-safe');
                    
                    let icon = st === 'fire' ? '<i class="fas fa-fire"></i>' : 
                               (st === 'warning' || st === 'gas leak' ? '<i class="fas fa-exclamation-triangle"></i>' : '');
                    
                    if(!markers[house.id]) {
                        const el = document.createElement('div');
                        el.className = cls; 
                        el.innerHTML = icon;
                        el.onclick = () => openLayoutModal(house.id);
                        markers[house.id] = new maplibregl.Marker({ element: el }).setLngLat([house.lng, house.lat]).addTo(map);
                    } else {
                        const el = markers[house.id].getElement();
                        el.className = cls;
                        el.innerHTML = icon;
                    }
                });
                // Update the UI counters
                document.getElementById('fire-count').innerText = fireCount;
                document.getElementById('warning-count').innerText = warnCount;
            }
        });
    }
    setInterval(fetchMapData, 2000);


    // --- 5. STATION SETUP ---
    window.startStationSetup = function() {
        document.getElementById('setup-overlay').style.background = 'rgba(0,0,0,0.3)';
        document.getElementById('setup-overlay').style.pointerEvents = 'none';
        document.getElementById('step-2').style.display = 'block';
        document.getElementById('step-2').style.pointerEvents = 'auto';
        document.getElementById('step-1').style.display = 'none';
        window.isSetupMode = true;
    };

    map.on('click', (e) => {
        if (!window.isSetupMode) return;

        // Fix: 'coords' was undefined. Use 'e.lngLat' from the click event.
        const clickedLat = e.lngLat.lat;
        const clickedLng = e.lngLat.lng;
        const stationName = "{{ user_profile.station.name|escapejs|default:'Station' }}";

        if (confirm(`Pin ${stationName} at this location?`)) {
            fetch("{% url 'sensors:update_station_coords' %}", {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json', 
                    'X-CSRFToken': getCookie('csrftoken') 
                },
                body: JSON.stringify({ 
                    lat: clickedLat, 
                    lng: clickedLng 
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("Station location saved!");
                    location.reload();
                } else {
                    alert("Error: " + data.error);
                }
            })
            .catch(err => {
                console.error("Coordinate update failed:", err);
                alert("Connection error. Please try again.");
            });
        }
    });

    window.switchStyle = function(styleName, btn) {
        document.querySelectorAll('.map-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        map.setStyle(styleName === 'satellite' ? { 'version': 8, 'sources': { 'raster-tiles': { 'type': 'raster', 'tiles': [STYLES.satellite], 'tileSize': 256 } }, 'layers': [{'id': 'simple-tiles', 'type': 'raster', 'source': 'raster-tiles'}] } : STYLES[styleName]);
    };
    // --- 4. STATION MARKERS & COVERAGE ZONES (RESTORED) ---
    map.on('load', function() {
        {% for st in all_stations %}
        (function() {
            // Safely parse coordinates from Django context
            const lng = parseFloat("{{ st.address.longitude }}");
            const lat = parseFloat("{{ st.address.latitude }}");
            
            if (isNaN(lng) || isNaN(lat)) return; 

            const name = "{{ st.name|escapejs }}";
            // Calculate radius based on coverage area (sqm to km)
            const area = parseFloat("{{ st.cover_area_sqm|default:0 }}");
            const radius = area > 0 ? Math.sqrt(area / Math.PI) / 1000 : 3.0; // Default 3km if area is 0

            // Create custom HTML element for Fire Station icon
            const el = document.createElement('div');
            el.innerHTML = '<i class="fas fa-building-shield"></i>';
            el.style.cssText = `
                background: #0d6efd; 
                width: 45px; 
                height: 45px; 
                border-radius: 50%; 
                color: white; 
                display: flex; 
                align-items: center; 
                justify-content: center; 
                border: 3px solid white; 
                box-shadow: 0 0 15px rgba(13, 110, 253, 0.6); 
                font-size: 22px; 
                cursor: pointer;
            `;
            
            // Add Marker to Map
            new maplibregl.Marker({ element: el })
                .setLngLat([lng, lat])
                .setPopup(new maplibregl.Popup({offset: 25}).setText(name))
                .addTo(map);

            // Add the blue Coverage Zone circle
            const sourceId = 'zone-{{ st.id }}';
            const circleData = createGeoJSONCircle([lng, lat], radius);
            
            if(circleData) {
                map.addSource(sourceId, circleData);
                map.addLayer({
                    'id': sourceId + '-fill',
                    'type': 'fill',
                    'source': sourceId,
                    'paint': { 'fill-color': '#0d6efd', 'fill-opacity': 0.15 }
                });
                map.addLayer({
                    'id': sourceId + '-line',
                    'type': 'line',
                    'source': sourceId,
                    'paint': { 'line-color': '#0d6efd', 'line-width': 2, 'line-dasharray': [2, 2] }
                });
            }
        })();
        {% endfor %}
    });

    // Helper function to generate the circle geometry for the coverage zones
    function createGeoJSONCircle(center, radiusInKm, points = 64) {
        if(!center || isNaN(center[0])) return null;
        const coords = { latitude: center[1], longitude: center[0] };
        const ret = [];
        const distanceX = radiusInKm / (111.320 * Math.cos(coords.latitude * Math.PI / 180));
        const distanceY = radiusInKm / 110.574;

        for(let i=0; i<points; i++) {
            let theta = (i/points)*(2*Math.PI);
            let x = distanceX * Math.cos(theta);
            let y = distanceY * Math.sin(theta);
            ret.push([coords.longitude+x, coords.latitude+y]);
        }
        ret.push(ret[0]);
        return { 
            "type": "geojson", 
            "data": { 
                "type": "FeatureCollection", 
                "features": [{ 
                    "type": "Feature", 
                    "geometry": { "type": "Polygon", "coordinates": [ret] } 
                }] 
            } 
        };
    }
</script>
