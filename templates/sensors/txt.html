

<script>
    /**
     * GLOBAL POPUP FUNCTION
     * type: 'success', 'error', 'warning', 'info'
     * title: Bold text
     * message: Smaller text
     * actionCallback: Function to run if user clicks "Yes" (optional)
     */
    function showPopup(type, title, message, actionCallback = null) {
        // 1. Get Elements
        const header = document.getElementById('globalModalHeader');
        const icon = document.getElementById('globalModalIcon');
        const actionBtn = document.getElementById('globalModalActionBtn');
        const cancelBtn = document.getElementById('globalModalCancelBtn');
        
        // 2. Reset Styles
        header.className = 'modal-header text-white';
        icon.className = 'fas fa-3x opacity-50';
        actionBtn.className = 'btn px-4 fw-bold';
        
        // 3. Apply Theme based on Type
        if (type === 'success') {
            header.classList.add('bg-success');
            icon.classList.add('fa-check-circle', 'text-success');
            actionBtn.classList.add('btn-success');
        } else if (type === 'error') {
            header.classList.add('bg-danger');
            icon.classList.add('fa-times-circle', 'text-danger');
            actionBtn.classList.add('btn-danger');
        } else if (type === 'warning') {
            header.classList.add('bg-warning');
            icon.classList.add('fa-exclamation-triangle', 'text-warning'); // Dark text for yellow
            header.classList.remove('text-white'); // Text dark for contrast
            header.classList.add('text-dark');
            actionBtn.classList.add('btn-warning');
        } else {
            header.classList.add('bg-primary');
            icon.classList.add('fa-info-circle', 'text-primary');
            actionBtn.classList.add('btn-primary');
        }

        // 4. Set Text
        document.getElementById('globalModalTitle').innerText = type.toUpperCase();
        document.getElementById('globalModalHeading').innerText = title;
        document.getElementById('globalModalMessage').innerHTML = message; // innerHTML allows bolding/breaks

        // 5. Handle Action Button (Confirmation Mode)
        if (actionCallback) {
            actionBtn.style.display = 'inline-block';
            actionBtn.innerText = "Yes, Proceed";
            cancelBtn.innerText = "Cancel";
            
            // Assign onclick handler properly (remove old listeners to prevent stacking)
            actionBtn.onclick = function() {
                actionCallback(); // Run the code you passed in
                const modal = bootstrap.Modal.getInstance(document.getElementById('globalModal'));
                modal.hide();
            };
        } else {
            // Alert Mode (No action button)
            actionBtn.style.display = 'none';
            cancelBtn.innerText = "OK";
        }

        // 6. Show Modal
        const myModal = new bootstrap.Modal(document.getElementById('globalModal'));
        myModal.show();
    }
</script>
