{% extends "sensors/layout/master.html" %}
{% load static %}

{% block title %}Create Fire Report{% endblock %}

{% block content %}
<div class="container mt-4">
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <div class="card shadow">
        <div class="card-header bg-danger text-white">
            <h4><i class="fas fa-fire-extinguisher"></i> Create New Fire Report</h4>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data" novalidate>
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fire_type" class="fw-bold">Fire Type <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="fire_type" name="fire_type" 
                               required placeholder="e.g., Building Fire, Vehicle Fire">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="cause" class="fw-bold">Cause of Fire <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="cause" name="cause" 
                               required placeholder="e.g., Electrical, Arson">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="station" class="fw-bold">Responding Station <span class="text-danger">*</span></label>
                        <select class="form-control" id="station" name="station" required>
                            <option value="">-- Select Fire Station --</option>
                            {% for station in stations %}
                                <option value="{{ station.id }}">{{ station.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="address" class="fw-bold">Incident Location <span class="text-muted">(Optional)</span></label>
                        <select class="form-control" id="address" name="address">
                            <option value="">-- Select Address --</option>
                            {% for address in addresses %}
                                <option value="{{ address.id }}">{{ address.street }}, {{ address.city }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="fw-bold">Description <span class="text-muted">(Optional)</span></label>
                    <textarea class="form-control" id="description" name="description" rows="3" 
                              placeholder="Provide details about the incident..."></textarea>
                </div>

                <hr>

                <div class="mb-3">
                    <label for="images" class="fw-bold">Evidence Photos</label>
                    <input type="file" class="form-control" id="images" name="images" 
                           accept="image/jpeg,image/png,image/gif" multiple>
                    <div id="file-preview" class="mt-3 row g-2"></div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'sensors:reports' %}" class="btn btn-secondary">
                        Cancel
                    </a>
                    
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-paper-plane"></i> Submit Report
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Simple Image Preview Logic
    const imageInput = document.getElementById('images');
    const previewContainer = document.getElementById('file-preview');

    imageInput.addEventListener('change', function(e) {
        previewContainer.innerHTML = ''; // Clear previous
        if (this.files) {
            Array.from(this.files).forEach(file => {
                // Size validation (5MB)
                if (file.size > 5*1024*1024) {
                    alert(`File ${file.name} is too big!`);
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(event) {
                    const col = document.createElement('div');
                    col.className = 'col-md-2 col-sm-4 col-6';
                    col.innerHTML = `
                        <div class="card shadow-sm border-0">
                            <img src="${event.target.result}" class="card-img-top rounded" style="height: 80px; object-fit: cover;">
                        </div>`;
                    previewContainer.appendChild(col);
                };
                reader.readAsDataURL(file);
            });
        }
    });
</script>

{% endblock %}
