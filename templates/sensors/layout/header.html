{% load static %}
<header>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-firefighter">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <img src="{% static 'images/jatanagara.png' %}" alt="JATA NEGARA MALAYSIA" width="40" height="40" class="d-inline-block align-text-top me-2">
                <img src="{% static 'images/bomba.png' %}" alt="JABATAN BOMBA DAN PENYELAMAT MALAYSIA" height="40" class="d-inline-block align-text-top me-3">
                <a class="navbar-brand" href="{% url 'home' %}">AI FIRE MONITORING</a>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'maintenance' %}">Maintenance</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'reports' %}">Reports</a>
                        </li>
                        <li class="nav-item dropdown">
                            <button class="nav-link dropdown-toggle" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            {% if user.userprofile.profile_picture %}
                                <img src="{{ user.userprofile.profile_picture.url }}" alt="{{ user.username }}" width="50" height="50" class="rounded-circle me-2 profile-pic" onerror="this.style.display='none'; document.querySelector('.profile-pic-default').style.display='inline-block';">
                            {% else %}
                                <svg class="rounded-circle me-2 profile-pic-default" width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"></path>
                                </svg>
                            {% endif %}
                            {% if not user.userprofile.profile_picture %}
                                <svg class="rounded-circle me-2 profile-pic-default" width="36" height="36" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"></path>
                                </svg>
                            {% endif %}
                                {{ user.username }}
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                                <li><a class="dropdown-item" href="{% url 'profile' %}">My Profile</a></li>
                                <li><a class="dropdown-item" href="{% url 'change_password' %}">Change Password</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form method="post" action="{% url 'logout' %}" style="display: inline;">
                                        {% csrf_token %}
                                        <button type="submit" class="dropdown-item" style="width: 100%; text-align: left; background: none; border: none; cursor: pointer;">
                                            Logout
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                    {% endif %}
                    <li class="nav-item">
                        <button class="btn btn-theme-toggle" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                            <svg id="sunIcon" class="theme-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                            <svg id="moonIcon" class="theme-icon hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<script>
    // Dark Mode Toggle
    (function() {
        const html = document.documentElement;
        let currentTheme = localStorage.getItem('theme') || 'light';
        
        // Apply theme and update icons
        function setTheme(theme) {
            html.dataset.theme = theme;
            currentTheme = theme;
            localStorage.setItem('theme', theme);
            updateIcons(theme);
            console.log('🎨 Theme set to:', theme);
        }
        
        // Update sun/moon icons
        function updateIcons(theme) {
            const sun = document.getElementById('sunIcon');
            const moon = document.getElementById('moonIcon');
            if (sun && moon) {
                if (theme === 'dark') {
                    sun.classList.add('hidden');
                    moon.classList.remove('hidden');
                } else {
                    sun.classList.remove('hidden');
                    moon.classList.add('hidden');
                }
            }
        }
        
        // Toggle between light and dark
        function toggleTheme() {
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            console.log('🔄 Toggle:', currentTheme, '→', newTheme);
            setTheme(newTheme);
        }
        
        // Attach button handler
        function attachButton() {
            const btn = document.getElementById('themeToggle');
            if (btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    toggleTheme();
                });
                console.log('✅ Button attached');
            }
        }
        
        // Initialize on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', attachButton);
        } else {
            attachButton();
        }
        
        // Ensure theme is set after body exists
        setTheme(currentTheme);
        console.log('🚀 Dark mode ready');
    })();
</script>
