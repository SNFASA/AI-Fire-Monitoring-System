{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/bomba.png' %}"/>
    <title>{% block title %}AI Fire Monitoring System{% endblock %}</title>
    
    <!-- Bootstrap CSS (Local) -->
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    
    <!-- Dark Mode CSS -->
    <link rel="stylesheet" href="{% static 'css/dark-mode.css' %}">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- Initialize theme ONLY on html element before rendering to prevent flash -->
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.setAttribute('data-bs-theme', theme);
            } catch (e) {}
        })();
    </script>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'sensors/layout/header.html' %} 
    <main>
        {% block content %} 
        {% endblock %}
    </main>
    {% include 'sensors/layout/footer.html' %}
    
    <!-- Bootstrap JS (Local) -->
    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    
    <!-- Utility Functions -->
    <!-- <script src="{% static 'js/utils.js' %}"></script> -->
    
    <!-- Page-specific Scripts -->
    {% block extra_js %}{% endblock %}
</body>
</html>
